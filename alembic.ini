# A generic, single database configuration.

[alembic]
# Path to the Alembic migration directory.
script_location = app/db/migrations

# Connection URL to the database.
# Replace this with your actual database connection URL, 
# or leave it as an environment variable for security.
sqlalchemy.url = postgresql://user:password@localhost/db_name

# Logging level. (INFO is typically suitable; DEBUG for more detail)
log_level = INFO

# Whether to run batch mode, which is required for SQLite but not for PostgreSQL.
# batch_mode = True

[post_write_hooks]
# This section is optional. It can be used to configure hooks that 
# run after Alembic migrations, e.g., to automatically format SQL files.

# Command to format migration files.
# This example uses `black`, the Python formatter, but you can customize.
hook_command = black
